name: Deploy Kuroiwa Farm to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter simple-homepage lint
      - name: Test
        run: pnpm --filter simple-homepage test
      - name: Build Kuroiwa Farm
        run: pnpm --filter simple-homepage build
      - name: Wait for legacy URL removal approval
        if: vars.ENGLISH_LEGACY_REMOVAL_APPROVED != 'true'
        run: |
          echo '::notice::Build verified. Pages publication is paused to preserve the legacy English school URL. Verify the new site and obtain owner approval before setting ENGLISH_LEGACY_REMOVAL_APPROVED=true.'
      - name: Configure Pages
        if: vars.ENGLISH_LEGACY_REMOVAL_APPROVED == 'true'
        uses: actions/configure-pages@v6
      - name: Upload site
        if: vars.ENGLISH_LEGACY_REMOVAL_APPROVED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        if: vars.ENGLISH_LEGACY_REMOVAL_APPROVED == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
